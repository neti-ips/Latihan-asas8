<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBT Latihan ASAS IPS Kelas 8</title>
<style>
:root{--bg:#f2f5fa;--cd:#fff;--tx:#0f1b2d;--mu:#5b6b82;--bt:#0f4c81;--lk:#0f4c81;--ac:#f2a900;--ok:#15803d;--er:#dc2626;--bd:#d9e2ee;--sh:0 10px 30px rgba(15,76,129,.10);--soft:#eaf1fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0b1220;--cd:#121c2e;--tx:#e8eef8;--mu:#93a4bd;--bt:#2a6fb5;--lk:#7fbcf5;--bd:#243350;--sh:none;--soft:#1a2740}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0b1220;--cd:#121c2e;--tx:#e8eef8;--mu:#93a4bd;--bt:#2a6fb5;--lk:#7fbcf5;--bd:#243350;--sh:none;--soft:#1a2740}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.top{background:linear-gradient(120deg,#0a2f55,#0f4c81 60%,#1b6fb8);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:var(--ac);color:#0a2f55;font-weight:800;display:grid;place-items:center}
.brand b{display:block;font-size:17px}.brand small{opacity:.85;font-size:12.5px}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:22px;box-shadow:var(--sh)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:stretch}
.info{background:linear-gradient(160deg,#0a2f55,#0f4c81);color:#fff;border-radius:16px;padding:28px}
.info h1{margin:0 0 6px;font-size:26px;line-height:1.2}.info p{opacity:.9;margin:6px 0}
.info ul{padding-left:18px;margin:14px 0}.info li{margin:5px 0}
.tag{display:inline-block;background:rgba(255,255,255,.15);padding:3px 10px;border-radius:99px;font-size:12.5px}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
.in,select{width:100%;padding:11px 13px;border:1.5px solid var(--bd);border-radius:10px;background:var(--cd)}
.in:focus,select:focus{outline:2px solid var(--bt);border-color:var(--bt)}
.btn{background:var(--bt);color:#fff;border:0;padding:11px 20px;border-radius:10px;font-weight:600;cursor:pointer}

.btn.g{background:var(--soft);color:var(--lk)}.btn.r{background:var(--er)}.btn.w{width:100%;margin-top:18px;padding:13px}
.lnk{background:none;border:0;color:var(--lk);cursor:pointer;text-decoration:underline;padding:6px}
.mu{color:var(--mu);font-size:13.5px}.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--lk)}

.op:hover{border-color:var(--bt)}.op.on{border-color:var(--bt);background:var(--soft)}
.op span{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--lk);font-weight:700;display:grid;place-items:center;font-size:14px}
.op.on span{background:var(--bt);color:#fff}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bs .op{justify-content:center;font-weight:700;margin:0}
.jr{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin:9px 0}
.act{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.nv{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.nv button{height:40px;border-radius:9px;border:1.5px solid var(--bd);background:var(--cd);cursor:pointer;font-weight:600}
.nv .a{background:var(--bt);color:#fff;border-color:var(--bt)}.nv .fl{background:var(--ac);color:#0a2f55;border-color:var(--ac)}.nv .c{outline:3px solid var(--lk);outline-offset:1px}

.ov{position:fixed;inset:0;background:rgba(5,15,30,.6);display:grid;place-items:center;z-index:20;padding:16px}.ov .card{max-width:420px;width:100%}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.st div{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px}.st b{display:block;font-size:26px;color:var(--lk)}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}.tabs button{padding:9px 16px;border:0;border-radius:10px;background:var(--soft);color:var(--lk);font-weight:600;cursor:pointer}.tabs .on{background:var(--bt);color:#fff}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{background:var(--soft);color:var(--lk)}
.ax{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}.ax div{border-radius:10px;padding:8px;text-align:center;font-size:13px;color:#fff}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row .in,.row select{width:auto;flex:1;min-width:140px}
@media(max-width:820px){.hero,.grid{grid-template-columns:1fr}.st{grid-template-columns:1fr 1fr}.jr{grid-template-columns:1fr}}
</style></head><body><div id="app"></div>
<script>
const ADM={u:'admin',p:'admin123'},K='asas8ips';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=(x,...o)=>({t:'p',x,o}),B=(x,a)=>({t:'b',x,a}),J=(x,l,r)=>({t:'j',x,l,r}),I=(x,...a)=>({t:'i',x,a});
/* Pilihan ganda: opsi pertama = jawaban benar (diacak otomatis saat tampil) */
const Q=[
P('Produksi, distribusi, dan konsumsi disebut kegiatan ekonomi karena ketiganya ...','berkaitan dengan upaya memenuhi kebutuhan hidup manusia','hanya dilakukan oleh pemerintah','hanya terjadi di pasar','selalu bertujuan mencari laba'),
P('Pak Dedi memiliki usaha pembuatan roti. Ia mengolah tepung, gula, dan telur menjadi roti siap jual. Peran Pak Dedi dalam kegiatan ekonomi adalah sebagai ...','produsen','konsumen','distributor','pemasok bahan baku'),
P('Keluarga Bu Ani menyewakan tanahnya dan anak-anaknya bekerja di perusahaan. Dalam kegiatan ekonomi, rumah tangga konsumen berperan sebagai ...','pemilik faktor produksi','pembuat kebijakan','penyalur barang','pemungut pajak'),
P('Indonesia membeli mesin pabrik dari Jepang. Dalam kegiatan ekonomi internasional, Jepang berperan sebagai ...','pemasok barang impor','pembeli barang ekspor','pemungut bea masuk','pengatur harga dunia'),
P('Toko roti "Manis" membeli roti dari pabrik lalu menjualnya kepada pembeli. Peran toko roti tersebut adalah ...','penyalur barang dari produsen ke konsumen','produsen roti','pemilik faktor produksi','pemungut pajak'),
P('Truk pengangkut sayur terlambat tiba di pasar sehingga sayuran layu. Dampak keterlambatan distribusi tersebut adalah ...','kualitas barang menurun dan nilai jualnya turun','kualitas barang meningkat','jumlah produksi bertambah','harga selalu naik dan barang laku keras'),
P('Petani memanen biji kopi, pedagang mengangkutnya ke kota, lalu masyarakat menyeduh dan meminumnya. Urutan kegiatan ekonominya adalah ...','produksi – distribusi – konsumsi','distribusi – produksi – konsumsi','konsumsi – produksi – distribusi','produksi – konsumsi – distribusi'),
P('Produsen sepatu menghasilkan 1.000 pasang, tetapi daya beli masyarakat sedang rendah sehingga hanya 400 pasang terjual. Tindakan rasional produsen adalah ...','menyesuaikan jumlah produksi dengan daya beli masyarakat','menambah produksi agar sepatu murah','menaikkan harga setinggi-tingginya','menghentikan usaha selamanya'),
P('Pak Budi menyumbangkan tenaganya sebagai faktor produksi di sebuah pabrik. Penerimaan yang ia peroleh berupa ...','upah','sewa','bunga','laba'),
P('Menjelang Ramadan, permintaan sirup meningkat tajam, sedangkan penawarannya relatif tetap. Harga sirup kemungkinan akan ...','naik','turun','tetap','menjadi nol'),
P('Hubungan antara perubahan harga barang dan jumlah barang yang diminta konsumen (faktor lain tetap) adalah ...','berbanding terbalik: harga naik, jumlah diminta turun','berbanding lurus: harga naik, jumlah diminta naik','tidak ada hubungan','harga naik, jumlah diminta tetap'),
P('Ibu Rina membeli sayuran langsung dari pedagang di Pasar Pagi, bertemu penjual dan melihat barangnya. Berdasarkan wujudnya, pasar tersebut termasuk pasar ...','konkret','abstrak','modal','tenaga kerja'),
P('Dina membeli jilbab melalui aplikasi perdagangan elektronik tanpa bertemu penjual. Pasar tempat transaksi tersebut disebut pasar ...','digital','konkret','induk','tradisional'),
P('Dalam proses tawar-menawar hingga tercapai kesepakatan harga, fungsi pasar yang tampak adalah ...','pembentuk harga','penyimpan barang','pencetak uang','pemungut pajak'),
P('Sebuah lembaga menghimpun dana masyarakat dalam bentuk tabungan dan menyalurkannya kembali dalam bentuk kredit. Lembaga tersebut adalah ...','bank','pegadaian','perusahaan asuransi','bursa efek'),
P('Ciri berikut: (1) ada tawar-menawar, (2) harga pas berlabel, (3) pelayanan mandiri, (4) bangunan sederhana. Ciri pasar tradisional ditunjukkan oleh nomor ...','1 dan 4','1 dan 2','2 dan 3','3 dan 4'),
P('Ciri-ciri pasar konkret adalah ...','penjual dan pembeli bertemu langsung dan barang tersedia di tempat','transaksi hanya melalui internet','barang tidak dapat dilihat','hanya memperdagangkan saham'),
P('Salah satu fungsi lembaga keuangan adalah ...','menyediakan jasa menyimpan dan menyalurkan dana','memproduksi barang konsumsi','menetapkan harga barang','memungut bea masuk'),
P('Berikut yang termasuk lembaga keuangan bukan bank adalah ...','Pegadaian','Bank Rakyat Indonesia','Bank Mandiri','Bank Perkreditan Rakyat'),
P('Rina membutuhkan pinjaman cepat dengan menjaminkan perhiasan emasnya. Lembaga keuangan non-bank yang tepat adalah ...','Pegadaian','Bank Sentral','Bursa Efek','perusahaan asuransi'),
P('Manfaat lembaga keuangan bagi masyarakat adalah ...','membantu menabung, memperoleh modal usaha, dan mengelola dana','menaikkan semua harga barang','menutup usaha kecil','menghapus kebutuhan masyarakat'),
P('Pak Heri membayar premi tiap bulan agar biaya perawatan ditanggung ketika ia sakit. Hal ini menunjukkan fungsi asuransi sebagai ...','pengelola (pengalih) risiko','sarana kredit usaha','tempat jual beli saham','alat tukar'),
P('Perbedaan sistem harga pasar modern dan pasar tradisional adalah ...','pasar modern berharga pas berlabel, pasar tradisional harga dibentuk lewat tawar-menawar','pasar modern ada tawar-menawar, pasar tradisional harga pas','keduanya selalu tawar-menawar','keduanya berharga pas'),
P('Dampak positif ekonomi digital bagi UMKM adalah ...','jangkauan pemasaran lebih luas melalui platform daring','pelanggan hanya berasal dari sekitar toko','biaya promosi pasti lebih mahal','usaha wajib tutup'),
P('Jual beli saham perusahaan dilakukan di pasar ...','modal','barang','tenaga kerja','induk'),
P('Peran konsumen dan produsen dalam kegiatan ekonomi yang benar adalah ...','konsumen menggunakan barang/jasa, produsen menghasilkannya','konsumen menghasilkan barang, produsen menggunakannya','keduanya sama-sama menghasilkan barang','keduanya hanya bertugas menyalurkan barang'),
P('Pengertian bea masuk dan bea keluar yang tepat adalah ...','bea masuk: pungutan atas barang impor; bea keluar: pungutan atas barang ekspor','bea masuk: pungutan atas barang ekspor; bea keluar: pungutan atas barang impor','keduanya pungutan atas barang antarpulau','keduanya pajak penghasilan'),
P('Pasangan lembaga keuangan bank dan lembaga keuangan nonbank berturut-turut adalah ...','BNI dan Pegadaian','Pegadaian dan BCA','Koperasi dan BRI','BPR dan Bank Mandiri'),
B('Perdagangan internasional bertujuan memenuhi kebutuhan yang tidak dapat dihasilkan sendiri dan menambah devisa negara.',true),
B('Rumah tangga hanya berperan sebagai konsumen dan tidak pernah menyediakan faktor produksi.',false),
B('Pedagang grosir yang menyalurkan beras dari penggilingan ke warung-warung merupakan contoh kegiatan distribusi.',true),
B('Pasar yang memperjualbelikan tenaga kerja, tanah, dan modal disebut pasar barang.',false),
J('Jodohkan kegiatan/pengertian berikut dengan istilah yang tepat!',['Membeli barang dari luar negeri','Menjual barang ke luar negeri','Pungutan pemerintah atas barang impor'],['Impor','Ekspor','Bea masuk']),
J('Jodohkan pelaku ekonomi berikut dengan perannya dalam kegiatan impor!',['Importir','Pemerintah (Bea Cukai)','Konsumen dalam negeri'],['Memasukkan/membeli barang dari luar negeri','Memungut bea masuk dan mengawasi barang impor','Menggunakan barang impor']),
I('Cadangan alat pembayaran luar negeri yang diperoleh suatu negara dari kegiatan ekspor disebut ...','devisa'),
I('Pelaku ekonomi terdiri atas rumah tangga, perusahaan, masyarakat luar negeri, dan ...','pemerintah'),
I('Ibu Sari membeli beras di warung untuk kebutuhan keluarga sehari-hari. Dalam kegiatan ekonomi, Ibu Sari berperan sebagai ...','konsumen'),
I('Berdasarkan wujudnya, penjualan produk melalui marketplace online termasuk pasar ... (jawab dengan satu kata)','abstrak','pasar abstrak'),
I('Istilah untuk pungutan pemerintah terhadap barang impor adalah ...','bea masuk','bea impor'),
I('Nilai ekspor suatu negara Rp12 triliun, sedangkan nilai impornya Rp9 triliun. Neraca perdagangan negara tersebut berada pada kondisi ...','surplus')
];
const SEC=[[0,28,'Pilihan Ganda','Pilih satu jawaban yang paling tepat.'],[28,32,'Benar – Salah','Tentukan apakah pernyataan berikut Benar atau Salah.'],[32,34,'Menjodohkan','Pasangkan setiap pernyataan dengan pilihan yang tepat.'],[34,40,'Isian Singkat','Ketik jawaban singkat (satu kata/istilah).']];
const sec=i=>SEC.find(s=>i>=s[0]&&i<s[1]);
let DB=null,S={dur:90,open:true,show:true},T=null,cur=0,tm=null,tab='h',R=[],fb='';
const ls={g(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const shuf=n=>{const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const hdr=r=>`<header class="top"><div class="brand"><div class="logo">IPS</div><div><b>Latihan ASAS Kelas 8</b><small>Asesmen Sumatif Akhir Semester Ganjil · TP 2026–2027</small><small style="display:block">SMPN 3 Way Pengubuan · Guru Mapel: Neti Lestari, S.Pd</small></div></div><div>${r||''}</div></header>`;
const show=h=>{$('#app').innerHTML=h;scrollTo(0,0)};
function modal(h){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="card">'+h+'</div>';document.body.appendChild(o);return o}
const closeM=()=>document.querySelectorAll('.ov').forEach(o=>o.remove());
function chip(){const e=$('#mode');if(e)e.textContent=DB?'● Terhubung – hasil tersinkron':'● Mode perangkat ini'}

function login(msg){
show(hdr()+`<div class="wrap"><div class="hero"><div class="info"><span class="tag">Computer Based Test</span><h1>Latihan ASAS<br>IPS Kelas VIII</h1><p>Ilmu Pengetahuan Sosial · Kurikulum Merdeka · Fase D</p><ul><li><b>40 soal</b>: pilihan ganda, benar–salah, menjodohkan, isian singkat</li><li>Waktu mengerjakan <b>${S.dur} menit</b></li><li>Soal berdasarkan kisi-kisi MGMP IPS Kabupaten Lampung Tengah</li><li>Jawaban tersimpan otomatis selama mengerjakan</li></ul><p class="mu" style="color:#cfe0f3">Guru Mata Pelajaran IPS<br><b style="font-size:17px">NETI LESTARI, S.Pd</b><br>SMP Negeri 3 Way Pengubuan</p></div>
<div class="card"><h2 style="margin:0 0 4px">Masuk Peserta</h2><div class="mu">Isi data dirimu dengan benar sebelum memulai.</div>
<label class="f">Nama Lengkap</label><input id="nm" class="in" placeholder="Nama lengkap" maxlength="60" autocomplete="off">
<label class="f">Kelas</label><input id="kl" class="in" placeholder="Contoh: VIII A" maxlength="12" autocomplete="off">
<div class="err" id="er">${msg||(S.open?'':'Ujian belum dibuka oleh admin.')}</div>
<button class="btn w" id="go" ${S.open?'':'disabled'}>Mulai Mengerjakan</button>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><span class="chip" id="mode"></span><button class="lnk" id="ad">Login Admin</button></div></div></div></div>`);
chip();$('#go').onclick=()=>{const n=$('#nm').value.trim(),k=$('#kl').value.trim().toUpperCase();if(n.length<3||!k){$('#er').textContent='Nama (min. 3 huruf) dan kelas wajib diisi.';return}
T={nama:n,kelas:k,t0:Date.now(),dur:S.dur,A:Q.map(()=>null),F:Q.map(()=>0),ord:Q.map(q=>shuf(q.t=='p'?q.o.length:q.t=='j'?q.r.length:0))};ls.s(K+'T',T);cur=0;test()};
$('#ad').onclick=admLogin}

function admLogin(m){
show(hdr()+`<div class="wrap" style="max-width:420px"><div class="card"><h2 style="margin:0 0 4px">Login Admin</h2><div class="mu">Kelola CBT dan lihat hasil siswa.</div>
<label class="f">Username</label><input id="u" class="in" autocomplete="off"><label class="f">Password</label><input id="p" type="password" class="in">
<div class="err" id="er">${m||''}</div><button class="btn w" id="ok">Masuk</button><div style="text-align:center;margin-top:10px"><button class="lnk" id="bk">← Kembali ke halaman siswa</button></div></div></div>`);
$('#bk').onclick=()=>login();const go=()=>{if($('#u').value.trim()==ADM.u&&$('#p').value==ADM.p)admin();else $('#er').textContent='Username atau password salah.'};$('#ok').onclick=go;$('#p').onkeydown=e=>{if(e.key=='Enter')go()}}

const ansd=i=>{const a=T.A[i],q=Q[i];return q.t=='j'?(a||[]).some(v=>v!==''&&v!=null):q.t=='i'?!!norm(a):a!=null};
function test(){
show(`<div class="bar"><div><b>${esc(T.nama)}</b> <span class="chip">${esc(T.kelas)}</span></div><div class="tmr" id="tm">--:--</div></div><div class="wrap"><div class="grid"><section class="card" id="qc"></section><aside class="card"><b>Navigasi Soal</b><div class="nv" id="nv" style="margin-top:12px"></div><div class="lg"><span>■ Terjawab</span><span>■ Ragu-ragu</span><span>□ Belum</span></div><button class="btn w" id="fin">Selesai &amp; Kumpulkan</button></aside></div></div>`);
$('#fin').onclick=ask;clearInterval(tm);tick();tm=setInterval(tick,1000);rq()}
function tick(){const l=T.t0+T.dur*60000-Date.now();if(l<=0){clearInterval(tm);fin();return}const m=Math.floor(l/60000),s=Math.floor(l/1000)%60,e=$('#tm');if(e){e.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');e.classList.toggle('low',l<300000)}}
function nav(){$('#nv').innerHTML=Q.map((q,i)=>`<button class="${T.F[i]?'fl':ansd(i)?'a':''} ${i==cur?'c':''}" onclick="go(${i})">${i+1}</button>`).join('')}
const go=i=>{cur=i;rq()};
function rq(){const q=Q[cur],a=T.A[cur],o=T.ord[cur],s=sec(cur);let b='';
if(q.t=='p')b=o.map((j,p)=>`<div class="op ${a===j?'on':''}" onclick="sa(${j})"><span>${'ABCD'[p]}</span><div>${esc(q.o[j])}</div></div>`).join('');
else if(q.t=='b')b=`<div class="bs"><div class="op ${a===true?'on':''}" onclick="sa(true)">BENAR</div><div class="op ${a===false?'on':''}" onclick="sa(false)">SALAH</div></div>`;
else if(q.t=='j')b=q.l.map((l,k)=>`<div class="jr"><div>${k+1}. ${esc(l)}</div><select onchange="sj(${k},this.value)"><option value="">– Pilih –</option>${o.map(j=>`<option value="${j}" ${a&&a[k]===j?'selected':''}>${esc(q.r[j])}</option>`).join('')}</select></div>`).join('');
else b=`<input class="in" value="${esc(a||'')}" placeholder="Ketik jawabanmu di sini" oninput="si(this.value)" autocomplete="off">`;
$('#qc').innerHTML=`<div class="qh"><span class="chip">${s[2]} · Soal ${cur+1} dari ${Q.length}</span><button class="btn g" onclick="fl()">${T.F[cur]?'★ Batalkan ragu-ragu':'☆ Ragu-ragu'}</button></div><div class="mu">${s[3]}</div><p class="qx">${esc(q.x)}</p>${b}<div class="act"><button class="btn g" ${cur?'':'disabled'} onclick="go(cur-1)">← Sebelumnya</button>${cur<Q.length-1?'<button class="btn" onclick="go(cur+1)">Selanjutnya →</button>':'<button class="btn" onclick="ask()">Selesai ✓</button>'}</div>`;nav()}
function sv(){ls.s(K+'T',T);nav()}
const sa=v=>{T.A[cur]=v;sv();rq()},si=v=>{T.A[cur]=v;sv()},fl=()=>{T.F[cur]=T.F[cur]?0:1;sv();rq()};
function sj(k,v){const a=T.A[cur]||Q[cur].l.map(()=>'');a[k]=v===''?'':+v;T.A[cur]=a;sv()}
function ask(){const u=Q.filter((_,i)=>!ansd(i)).length,f=T.F.filter(Boolean).length;const m=modal(`<h3 style="margin:0 0 8px">Kumpulkan jawaban?</h3><p>${u?`Masih ada <b>${u} soal</b> belum dijawab.`:'Semua soal sudah dijawab.'}${f?` Ada <b>${f}</b> soal ditandai ragu-ragu.`:''} Jawaban tidak dapat diubah setelah dikumpulkan.</p><div class="act"><button class="btn g" id="n">Periksa lagi</button><button class="btn" id="y">Ya, kumpulkan</button></div>`);m.querySelector('#n').onclick=closeM;m.querySelector('#y').onclick=()=>{closeM();fin()}}
function score(i){const q=Q[i],a=T.A[i];if(a==null)return 0;if(q.t=='p')return a===0?1:0;if(q.t=='b')return a===q.a?1:0;if(q.t=='j')return q.l.filter((_,k)=>a[k]===k).length/q.l.length;return q.a.map(norm).includes(norm(a))?1:0}
async function fin(){clearInterval(tm);const d=Q.map((_,i)=>Math.round(score(i)*100)/100),sum=d.reduce((x,y)=>x+y,0);
const r={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),nama:T.nama,kelas:T.kelas,nilai:Math.round(sum/Q.length*1000)/10,benar:Math.round(sum*10)/10,mulai:new Date(T.t0).toISOString(),selesai:new Date().toISOString(),dur:Math.min(Math.round((Date.now()-T.t0)/1000),T.dur*60),d};
let ok=false;if(DB){try{const u=await claude.use('user'),id=u?await u.id():null;if(id){r.u=id;await DB.doc('hasil/'+id).set(r);ok=true}}catch(e){}}
const L=ls.g(K+'R',[]);L.push(r);ls.s(K+'R',L);ls.s(K+'T',null);
show(hdr()+`<div class="wrap" style="max-width:560px"><div class="card" style="text-align:center"><h2 style="margin:0">Terima kasih, ${esc(r.nama)}!</h2><div class="mu">Kelas ${esc(r.kelas)} · jawabanmu sudah dikumpulkan</div><div style="margin:26px 0">${S.show?`<div class="mu">Nilai</div><div class="sc">${r.nilai}</div><div class="mu" style="margin-top:8px">Skor ${r.benar} dari ${Q.length} soal</div>`:'<p>Nilai akan diumumkan oleh guru.</p>'}</div>${ok?'':'<div class="err">Hasil hanya tersimpan di perangkat ini. Beri tahu gurumu.</div>'}<button class="btn w" onclick="login()">Selesai</button></div></div>`)}

/* ADMIN */
async function loadR(){const m={};ls.g(K+'R',[]).forEach(r=>m[r.id]=r);fb='';if(DB){try{const s=await DB.collection('hasil').get();s.docs.forEach(d=>{const x=d.data();m[x.id]=x})}catch(e){fb='Data server tidak dapat dibaca; menampilkan data perangkat ini.'}}else fb='Tidak tersambung ke server; menampilkan data perangkat ini.';return Object.values(m).sort((a,b)=>a.selesai<b.selesai?1:-1)}
async function admin(){show(hdr('<button class="btn g" onclick="login()">Keluar</button>')+'<div class="wrap"><div class="card">Memuat data…</div></div>');R=await loadR();ap()}
function ap(){const n=R.length,av=n?R.reduce((x,r)=>x+r.nilai,0)/n:0,mx=n?Math.max(...R.map(r=>r.nilai)):0,mn=n?Math.min(...R.map(r=>r.nilai)):0;
show(hdr('<button class="btn g" onclick="login()">Keluar</button>')+`<div class="wrap"><div class="st"><div><span class="mu">Peserta</span><b>${n}</b></div><div><span class="mu">Rata-rata</span><b>${av.toFixed(1)}</b></div><div><span class="mu">Tertinggi</span><b>${mx}</b></div><div><span class="mu">Terendah</span><b>${mn}</b></div></div>
<div class="tabs"><button class="${tab=='h'?'on':''}" onclick="tab='h';ap()">Hasil Siswa</button><button class="${tab=='a'?'on':''}" onclick="tab='a';ap()">Analisis Soal</button><button class="${tab=='s'?'on':''}" onclick="tab='s';ap()">Pengaturan</button></div>${fb?`<div class="err" style="margin:0 0 10px">${fb}</div>`:''}<div class="card" id="pn"></div></div>`);
if(tab=='h')tH();else if(tab=='a')tA();else tS()}
function tH(){const ks=[...new Set(R.map(r=>r.kelas))].sort();$('#pn').innerHTML=`<div class="row"><input class="in" id="q" placeholder="Cari nama…"><select id="kf"><option value="">Semua kelas</option>${ks.map(k=>`<option>${esc(k)}</option>`).join('')}</select><button class="btn g" onclick="csv()">Unduh CSV</button><button class="btn g" onclick="admin()">↻ Muat ulang</button><button class="btn r" onclick="delAll()">Hapus semua</button></div><div class="tw"><table><thead><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Nilai</th><th>Skor</th><th>Durasi</th><th>Selesai</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
const f=()=>{const q=norm($('#q').value),k=$('#kf').value,L=R.filter(r=>(!q||norm(r.nama).includes(q))&&(!k||r.kelas==k));$('#tb').innerHTML=L.length?L.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td><b>${r.nilai}</b></td><td>${r.benar}/${Q.length}</td><td>${Math.floor(r.dur/60)}m ${r.dur%60}d</td><td>${new Date(r.selesai).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'})}</td><td><button class="lnk" onclick="del('${r.id}')">hapus</button></td></tr>`).join(''):'<tr><td colspan=8 class="mu">Belum ada data hasil.</td></tr>'};$('#q').oninput=f;$('#kf').onchange=f;f()}
function tA(){const n=R.length;$('#pn').innerHTML=`<b>Persentase siswa menjawab benar per soal</b><div class="mu" style="margin:4px 0 14px">Hijau: mudah (≥70%) · Kuning: sedang (40–69%) · Merah: sulit (&lt;40%)</div>${n?`<div class="ax">${Q.map((_,i)=>{const p=Math.round(R.reduce((x,r)=>x+(r.d[i]||0),0)/n*100);return`<div style="background:${p>=70?'#15803d':p>=40?'#b7791f':'#dc2626'}">No ${i+1}<br><b>${p}%</b></div>`}).join('')}</div>`:'<div class="mu">Belum ada data.</div>'}`}
function tS(){$('#pn').innerHTML=`<b>Pengaturan CBT</b><label class="f">Durasi mengerjakan (menit)</label><input id="du" type="number" min="5" max="180" class="in" value="${S.dur}" style="max-width:160px">
<label class="f"><input type="checkbox" id="op" ${S.open?'checked':''}> Ujian dibuka (siswa dapat login)</label><label class="f"><input type="checkbox" id="sh" ${S.show?'checked':''}> Tampilkan nilai kepada siswa setelah selesai</label>
<button class="btn" id="sv" style="margin-top:14px">Simpan Pengaturan</button><div id="ms" class="mu" style="margin-top:10px"></div>`;
$('#sv').onclick=async()=>{S={dur:Math.max(5,Math.min(180,+$('#du').value||90)),open:$('#op').checked,show:$('#sh').checked};ls.s(K+'S',S);let m='Tersimpan di perangkat ini.';if(DB){try{await DB.doc('pengaturan/umum').set(S);m='Tersimpan dan berlaku untuk semua siswa.'}catch(e){m='Gagal menyimpan ke server; hanya tersimpan di perangkat ini.'}}$('#ms').textContent=m}}
function del(id){const m=modal('<p>Hapus hasil siswa ini?</p><div class="act"><button class="btn g" id="n">Batal</button><button class="btn r" id="y">Hapus</button></div>');m.querySelector('#n').onclick=closeM;m.querySelector('#y').onclick=async()=>{closeM();await rm([id]);R=R.filter(r=>r.id!=id);ap()}}
function delAll(){const m=modal(`<p>Hapus <b>semua ${R.length} hasil</b>? Tindakan ini tidak dapat dibatalkan.</p><div class="act"><button class="btn g" id="n">Batal</button><button class="btn r" id="y">Hapus semua</button></div>`);m.querySelector('#n').onclick=closeM;m.querySelector('#y').onclick=async()=>{closeM();await rm(R.map(r=>r.id));R=[];ap()}}
async function rm(ids){ls.s(K+'R',ls.g(K+'R',[]).filter(r=>!ids.includes(r.id)));if(DB)for(const i of ids){const r=R.find(x=>x.id==i);try{await DB.doc('hasil/'+((r&&r.u)||i)).delete()}catch(e){}}}
async function csv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"',t='\ufeffNo,Nama,Kelas,Nilai,Skor,Durasi (detik),Selesai\n'+R.map((r,i)=>[i+1,q(r.nama),q(r.kelas),r.nilai,r.benar,r.dur,r.selesai].join(',')).join('\n');
try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:'hasil-asas-ips-kelas8.csv',data:t})}catch(e){modal('<p>Unduhan tidak tersedia di tampilan ini.</p><div class="act"><button class="btn" onclick="closeM()">Tutup</button></div>')}}

/* INIT */
(async()=>{S={...S,...ls.g(K+'S',{})};T=ls.g(K+'T',null);
if(T&&T.t0+T.dur*60000>Date.now()){cur=0;test()}else{T=null;login()}
try{DB=await window.claude.use('db')}catch(e){DB=null}
if(DB){try{const d=await DB.doc('pengaturan/umum').get();if(d.exists){S={...S,...d.data()};if(!T)login()}}catch(e){}}chip()})();
</script></body></html>
